<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:1;background:var(--primary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px}.main img{width:220px;height:220px}
.name{font-family:var(--font-display);font-weight:600;font-size:96px;line-height:.95;letter-spacing:-.02em;color:#FFFCF6;text-align:center}
.strip{width:25%;display:flex;flex-direction:column}.strip span{flex:1}</style></head>
<body><div class="main"><img src="assets/brand/mark.svg" alt=""><div class="name">Spanish Quizzes</div></div>
<div class="strip"><span style="background:#F2A81D"></span><span style="background:#6E8F5E"></span><span style="background:#C4553F"></span><span style="background:#BA1A1A"></span></div>
</body></html>
