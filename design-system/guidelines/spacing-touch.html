<!-- @dsCard group="Spacing" viewport="700x140" name="Touch targets" subtitle="44 minimum, 48 default, 56 for round options and Next" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div class="row" style="align-items:center">
<span style="display:grid;place-items:center;min-height:44px;padding:0 18px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);font-size:14px">44 min</span>
<span style="display:grid;place-items:center;min-height:48px;padding:0 18px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);font-size:14px">48 default</span>
<span style="display:grid;place-items:center;min-height:52px;padding:0 18px;border:2px solid var(--ink);border-radius:8px;background:var(--primary);color:var(--primary-ink);font-family:var(--font-display);font-size:16px;font-weight:600;box-shadow:4px 4px 0 var(--shadow-col)">52 main action</span>
<span style="display:grid;place-items:center;min-height:56px;padding:0 14px;border:2px solid var(--line);border-radius:8px;font-size:14px;color:var(--muted)">56 round option</span>
</div>
</body></html>
