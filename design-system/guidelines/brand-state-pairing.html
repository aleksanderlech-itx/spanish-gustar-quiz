<!-- @dsCard group="Brand" viewport="700x180" name="State pairing rule" subtitle="Every wash carries a symbol and a written label" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px">
<button style="width:100%;min-height:52px;padding:0 16px;border:2px solid var(--ink);border-radius:8px;background:var(--sage-soft);color:var(--ink);font-family:var(--font-body);font-size:17px;font-weight:600;text-align:left;display:flex;align-items:center;gap:10px;box-shadow:2px 2px 0 var(--shadow-col)"><span style="font-size:18px">✓</span>está cansada<span style="margin-left:auto;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sage)">Correct</span></button>
<button style="width:100%;min-height:52px;padding:0 16px;border:2px solid var(--ink);border-radius:8px;background:var(--danger-soft);color:var(--ink);font-family:var(--font-body);font-size:17px;font-weight:600;text-align:left;display:flex;align-items:center;gap:10px;text-decoration:line-through;box-shadow:2px 2px 0 var(--shadow-col)"><span style="font-size:18px;text-decoration:none">✕</span>es cansada<span style="margin-left:auto;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--danger);text-decoration:none">Wrong</span></button>
</div>
</body></html>
