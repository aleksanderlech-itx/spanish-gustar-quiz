<!-- @dsCard group="Colors" viewport="700x150" name="Paper & ink" subtitle="Canvas, elevated surface, quiet panel, ink and hairline" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div class="row">
<div class="sw"><div class="fill" style="background:var(--paper)"></div><div class="cap"><div class="nm">paper</div><div class="mono">#F5EFE4 / #1B1A17</div><div style="font-size:12px;color:var(--muted);margin-top:3px">canvas</div></div></div>
<div class="sw"><div class="fill" style="background:var(--surface)"></div><div class="cap"><div class="nm">surface</div><div class="mono">#FFFCF6 / #262420</div><div style="font-size:12px;color:var(--muted);margin-top:3px">cards</div></div></div>
<div class="sw"><div class="fill" style="background:var(--panel)"></div><div class="cap"><div class="nm">panel</div><div class="mono">#EFE7D9 / #2F2C27</div><div style="font-size:12px;color:var(--muted);margin-top:3px">quiet</div></div></div>
<div class="sw"><div class="fill" style="background:var(--ink)"></div><div class="cap"><div class="nm">ink</div><div class="mono">#2C2B29 / #F4EFE6</div><div style="font-size:12px;color:var(--muted);margin-top:3px">borders, text</div></div></div>
<div class="sw"><div class="fill" style="background:var(--line)"></div><div class="cap"><div class="nm">line</div><div class="mono">#DCD2C2 / #45403A</div><div style="font-size:12px;color:var(--muted);margin-top:3px">hairline</div></div></div>
<div class="sw"><div class="fill" style="background:var(--muted)"></div><div class="cap"><div class="nm">muted</div><div class="mono">#6B6459 / #B5AC9C</div><div style="font-size:12px;color:var(--muted);margin-top:3px">secondary text</div></div></div>
</div>
</body></html>
