<!-- @dsCard group="Spacing" viewport="700x190" name="Spacing scale" subtitle="4px unit — 8, 16, 20, 24, 32" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:12px"><span style="width:8px;height:20px;background:var(--primary);border:2px solid var(--ink)"></span><span style="font-size:14px">8 — stack-sm, inside chips</span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:16px;height:20px;background:var(--primary);border:2px solid var(--ink)"></span><span style="font-size:14px">16 — grid gutter, stack-md</span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:20px;height:20px;background:var(--primary);border:2px solid var(--ink)"></span><span style="font-size:14px">20 — card padding</span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:24px;height:20px;background:var(--primary);border:2px solid var(--ink)"></span><span style="font-size:14px">24 — page margin</span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:32px;height:20px;background:var(--primary);border:2px solid var(--ink)"></span><span style="font-size:14px">32 — section separation</span></div>
</div>
</body></html>
