<!-- @dsCard group="Colors" viewport="700x170" name="Dark theme" subtitle="Both themes are equal citizens — every token resolves in each" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div data-theme="dark" style="background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;gap:12px;align-items:center"><span style="font-family:var(--font-display);font-size:20px;font-weight:600">Buenos días, Alek.</span>
<span style="border:1px solid var(--ink);border-radius:999px;background:var(--primary-soft);padding:2px 12px;font-size:13px;font-weight:600">A2</span></div>
<div class="row" style="gap:8px">
<span style="flex:1;height:38px;border:2px solid var(--ink);border-radius:6px;background:var(--primary)"></span><span style="flex:1;height:38px;border:2px solid var(--ink);border-radius:6px;background:var(--sun)"></span><span style="flex:1;height:38px;border:2px solid var(--ink);border-radius:6px;background:var(--clay)"></span><span style="flex:1;height:38px;border:2px solid var(--ink);border-radius:6px;background:var(--sage)"></span><span style="flex:1;height:38px;border:2px solid var(--ink);border-radius:6px;background:var(--danger)"></span>
</div>
<div style="display:flex;gap:10px"><button style="min-height:44px;padding:0 18px;border:2px solid var(--ink);border-radius:8px;background:var(--primary);color:var(--primary-ink);font-family:var(--font-display);font-size:16px;font-weight:600;box-shadow:4px 4px 0 var(--shadow-col)">Check answer</button>
<button style="min-height:44px;padding:0 18px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink);font-family:var(--font-display);font-size:16px;font-weight:600;box-shadow:4px 4px 0 var(--shadow-col)">Secondary</button></div>
</div>
</body></html>
