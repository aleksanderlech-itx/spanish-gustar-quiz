<!-- @dsCard group="Brand" viewport="700x150" name="Organic radii" subtitle="Four rotating sets so neighbouring cards never match" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div class="row">
<div style="flex:1;min-width:120px;height:76px;border:2px solid var(--ink);border-radius:var(--radius-organic-1);background:var(--surface);display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;text-align:center">organic-1</div><div style="flex:1;min-width:120px;height:76px;border:2px solid var(--ink);border-radius:var(--radius-organic-2);background:var(--surface);display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;text-align:center">organic-2</div><div style="flex:1;min-width:120px;height:76px;border:2px solid var(--ink);border-radius:var(--radius-organic-3);background:var(--surface);display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;text-align:center">organic-3</div><div style="flex:1;min-width:120px;height:76px;border:2px solid var(--ink);border-radius:var(--radius-organic-4);background:var(--surface);display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;text-align:center">organic-4</div>
</div>
</body></html>
