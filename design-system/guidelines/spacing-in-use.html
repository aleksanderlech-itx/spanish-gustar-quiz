<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing in use" subtitle="24px page margin, 16px stack, 20px card padding" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div style="border:2px dashed var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px;background:var(--panel-soft)">
<div style="border:2px solid var(--ink);border-radius:var(--radius-organic-1);background:var(--surface);padding:20px;font-size:14px">card · 20px padding</div>
<div style="border:2px solid var(--ink);border-radius:var(--radius-organic-2);background:var(--surface);padding:20px;font-size:14px">16px between stacked cards</div>
<span class="mono">outer dashed edge = 24px page margin</span>
</div>
</body></html>
