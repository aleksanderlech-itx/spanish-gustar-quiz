<!-- @dsCard group="Colors" viewport="700x150" name="Primary teal" subtitle="Primary actions, active nav, progress fill" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div class="row">
<div class="sw"><div class="fill" style="background:var(--primary)"></div><div class="cap"><div class="nm">primary</div><div class="mono">#00625D / #67D8D0</div></div></div>
<div class="sw"><div class="fill" style="background:var(--primary-dark)"></div><div class="cap"><div class="nm">primary-dark</div><div class="mono">#00625D / #8FEAE3</div></div></div>
<div class="sw"><div class="fill" style="background:var(--primary-soft)"></div><div class="cap"><div class="nm">primary-soft</div><div class="mono">#C9F2EE / #0C4A46</div></div></div>
<div class="sw"><div class="fill" style="background:var(--primary-ink)"></div><div class="cap"><div class="nm">primary-ink</div><div class="mono">#FFFFFF / #06322F</div></div></div>
</div>
</body></html>
