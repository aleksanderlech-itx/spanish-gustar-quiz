<!-- @dsCard group="Type" viewport="700x170" name="Quiz prompt" subtitle="clamp(22px, 6.4vw, 28px) — never below 21px" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div style="border:2px solid var(--ink);border-radius:var(--radius-organic-1);background:var(--surface);box-shadow:4px 4px 0 var(--shadow-col);padding:18px;display:flex;flex-direction:column;gap:10px">
<span style="font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--clay)">Ser vs estar</span>
<div style="font-size:26px;font-weight:700;line-height:1.35">La sopa <span style="display:inline-block;min-width:100px;border-bottom:3px solid var(--sun);text-align:center;color:var(--muted)">?</span> fría.</div>
<span style="font-size:14px;color:var(--muted)">The soup is cold — right now.</span>
</div>
</body></html>
