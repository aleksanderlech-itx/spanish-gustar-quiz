<!-- @dsCard group="Brand" viewport="700x160" name="Depth & press" subtitle="Solid ink offsets: hover sinks 2px, active flattens" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div class="row" style="align-items:center">
<div style="width:120px;height:64px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);box-shadow:4px 4px 0 var(--shadow-col);display:grid;place-items:center;font-size:12px">rest · 4px</div>
<div style="width:120px;height:64px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);box-shadow:2px 2px 0 var(--shadow-col);transform:translate(2px,2px);display:grid;place-items:center;font-size:12px">hover · 2px</div>
<div style="width:120px;height:64px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);transform:translate(4px,4px);display:grid;place-items:center;font-size:12px">active · 0</div>
<div style="width:120px;height:64px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);box-shadow:6px 6px 0 var(--shadow-col);display:grid;place-items:center;font-size:12px">shell · 6px</div>
<p style="margin:0;flex:1;min-width:150px;font-size:13px;line-height:1.55;color:var(--muted)">No Gaussian blur. No gradients.</p>
</div>
</body></html>
