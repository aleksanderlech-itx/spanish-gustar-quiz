<!-- @dsCard group="Brand" viewport="700x140" name="Icon vocabulary" subtitle="Unicode marks in Karla plus the brand mark — no icon library" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div class="row" style="align-items:center;gap:18px">
<span style="font-size:22px;color:var(--sage)">✓</span><span style="font-size:22px;color:var(--danger)">✕</span><span style="font-size:22px;color:var(--clay)">↺</span>
<span style="font-size:22px">←</span><span style="font-size:22px">→</span><span style="font-size:22px">⇄</span><span style="font-size:22px;color:var(--sun)">★</span>
<span style="width:2px;height:28px;background:var(--line)"></span>
<img src="../assets/brand/mark.svg" width="28" height="28" alt="">
<span class="mono" style="flex:1;min-width:160px">brand mark · assets/brand/mark.svg</span>
</div>
</body></html>
