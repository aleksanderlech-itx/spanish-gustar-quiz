<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div class="row">
<div style="width:110px;height:64px;border:2px solid var(--ink);border-radius:var(--radius-sm);background:var(--panel-soft);display:grid;place-items:center;font-size:12px">4px</div><div style="width:110px;height:64px;border:2px solid var(--ink);border-radius:var(--radius-md);background:var(--panel-soft);display:grid;place-items:center;font-size:12px">6px</div><div style="width:110px;height:64px;border:2px solid var(--ink);border-radius:var(--radius-lg);background:var(--panel-soft);display:grid;place-items:center;font-size:12px">8px</div><div style="width:110px;height:64px;border:2px solid var(--ink);border-radius:var(--radius-pill);background:var(--panel-soft);display:grid;place-items:center;font-size:12px">pill</div><div style="width:110px;height:64px;border:2px solid var(--ink);border-radius:var(--radius-phone);background:var(--panel-soft);display:grid;place-items:center;font-size:12px">26px</div>
</div>
</body></html>
