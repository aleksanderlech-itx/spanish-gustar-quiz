<!-- @dsCard group="Type" viewport="700x140" name="Pairing" subtitle="Fraunces over Karla — display never sets paragraphs" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div style="border:2px solid var(--ink);border-radius:8px;background:var(--surface);padding:14px"><div style="font-family:var(--font-display);font-size:24px;font-weight:600">Round complete.</div><div style="font-size:15px;line-height:1.6;color:var(--muted);margin-top:6px">Best round yet on ser vs estar.</div><div class="mono" style="margin-top:8px">Fraunces title + Karla body</div></div>
<div style="border:2px dashed var(--line);border-radius:8px;padding:14px"><div style="font-family:var(--font-mono);font-size:13px;line-height:1.7">--font-display: Fraunces<br>--font-body: Karla<br>--font-mono: ui-monospace</div></div>
</div>
</body></html>
