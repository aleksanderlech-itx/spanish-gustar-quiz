<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div style="display:flex;flex-direction:column;gap:14px">
<div><div style="font-size:14px;font-weight:500;letter-spacing:.05em;text-transform:uppercase">Label caps 14</div><div class="mono">Karla 500 · metadata</div></div>
<div><div style="font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)">Eyebrow 12 · .16em</div><div class="mono">Karla 600 · section eyebrows</div></div>
<div><div style="font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sage)">Correct</div><div class="mono">Karla 700 · state labels</div></div>
</div>
</body></html>
