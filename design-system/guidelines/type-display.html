<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}

<div style="display:flex;flex-direction:column;gap:12px">
<div><div style="font-family:var(--font-display);font-size:36px;font-weight:600;line-height:1.2;letter-spacing:-.02em">Display 36/1.2</div><div class="mono">Fraunces 600 · screen titles</div></div>
<div><div style="font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.3">Headline 28/1.3</div><div class="mono">Fraunces 600 · 24px on mobile</div></div>
<div><div style="font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.4">Title 18/1.4</div><div class="mono">Fraunces 600 · card headings, buttons</div></div>
</div>
</body></html>
