<!-- @dsCard group="Colors" viewport="700x150" name="Answer states" subtitle="Correct, wrong, again — never colour alone" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div class="row">
<div class="sw"><div class="fill" style="background:var(--sage)"></div><div class="cap"><div class="nm">state-correct</div><div class="mono">#6E8F5E / #A9D18F</div><div style="font-size:12px;color:var(--muted);margin-top:3px">✓ Correct</div></div></div>
<div class="sw"><div class="fill" style="background:var(--danger)"></div><div class="cap"><div class="nm">state-wrong</div><div class="mono">#BA1A1A / #FFB4AB</div><div style="font-size:12px;color:var(--muted);margin-top:3px">✕ Wrong</div></div></div>
<div class="sw"><div class="fill" style="background:var(--clay)"></div><div class="cap"><div class="nm">state-again</div><div class="mono">#C4553F / #FF9C82</div><div style="font-size:12px;color:var(--muted);margin-top:3px">↺ Again</div></div></div>
<div class="sw"><div class="fill" style="background:var(--sun)"></div><div class="cap"><div class="nm">state-streak</div><div class="mono">#F2A81D / #FFC24D</div><div style="font-size:12px;color:var(--muted);margin-top:3px">★ Streak</div></div></div>
</div>
</body></html>
