<!-- @dsCard group="Colors" viewport="700x130" name="Soft washes" subtitle="Chips, tinted panels and answer-state fills" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div class="row" style="gap:10px">
<div style="flex:1;min-width:96px;border:2px solid var(--ink);border-radius:10px;padding:12px;background:var(--primary-soft)"><div class="nm">primary-soft</div><div style="font-size:12px;color:var(--muted)">chips, counts</div></div><div style="flex:1;min-width:96px;border:2px solid var(--ink);border-radius:10px;padding:12px;background:var(--sun-soft)"><div class="nm">sun-soft</div><div style="font-size:12px;color:var(--muted)">streak banner</div></div><div style="flex:1;min-width:96px;border:2px solid var(--ink);border-radius:10px;padding:12px;background:var(--sage-soft)"><div class="nm">sage-soft</div><div style="font-size:12px;color:var(--muted)">correct wash</div></div><div style="flex:1;min-width:96px;border:2px solid var(--ink);border-radius:10px;padding:12px;background:var(--clay-soft)"><div class="nm">clay-soft</div><div style="font-size:12px;color:var(--muted)">again state</div></div><div style="flex:1;min-width:96px;border:2px solid var(--ink);border-radius:10px;padding:12px;background:var(--danger-soft)"><div class="nm">danger-soft</div><div style="font-size:12px;color:var(--muted)">wrong wash</div></div><div style="flex:1;min-width:96px;border:2px solid var(--ink);border-radius:10px;padding:12px;background:var(--panel)"><div class="nm">panel</div><div style="font-size:12px;color:var(--muted)">quiet blocks</div></div>
</div>
</body></html>
