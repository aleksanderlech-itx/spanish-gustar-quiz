<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sw{flex:1;min-width:96px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw .fill{height:56px}.sw .cap{padding:8px 10px;border-top:2px solid var(--ink)}
.nm{font-size:13px;font-weight:700}</style></head><body>
<div class="row" style="align-items:center">
<input value="gustan" style="min-height:48px;padding:0 14px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink);font-family:var(--font-body);font-size:18px;outline:3px solid var(--sun);outline-offset:2px">
<span style="display:grid;place-items:center;min-height:48px;padding:0 16px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);font-size:13px">2px ink border</span>
<span style="display:grid;place-items:center;min-height:32px;padding:0 14px;border:1px solid var(--ink);border-radius:999px;background:var(--primary-soft);font-size:13px;font-weight:600">1px hairline chip</span>
</div>
</body></html>
