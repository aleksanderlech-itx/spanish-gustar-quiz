<!DOCTYPE html><html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:18px;background:var(--paper)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.col{display:flex;flex-direction:column;gap:12px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const {Input,Select,SegmentedControl,AnswerOption,InlineBlank}=window.QuizStudioDesignSystem_fb0db2;
const App=()=>{
  const [mode,setMode]=React.useState("Choose");
  return (
    <div className="grid">
      <div className="col">
        <Input id="v" label="Type the verb" placeholder="gustan"/>
        <Select id="t" label="Topic" options={["Ser vs estar","Gustar patterns","Preterite vs imperfect"]}/>
        <SegmentedControl options={["Choose","Type"]} value={mode} onChange={setMode}/>
        <div style={{fontSize:"22px",fontWeight:700,lineHeight:1.35}}>La sopa <InlineBlank/> fría.</div>
        <div style={{fontSize:"22px",fontWeight:700,lineHeight:1.35}}>La sopa <InlineBlank value="está" filled/> fría.</div>
      </div>
      <div className="col">
        <AnswerOption>estaba cansada</AnswerOption>
        <AnswerOption state="other">estaba cansada</AnswerOption>
        <AnswerOption state="correct">está cansada</AnswerOption>
        <AnswerOption state="wrong">es cansada</AnswerOption>
        <Input state="correct" defaultValue="fui"/>
      </div>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
