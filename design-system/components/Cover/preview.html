<!-- @dsCard height=300 -->
<style>
  html, body { margin: 0; background: var(--paper); }
  .cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--paper); }
  .cv svg { position: absolute; inset: 0; }
  .b-primary { fill: var(--primary); }
  .b-clay { fill: var(--clay); }
  .b-sun { fill: var(--sun); }
  .b-ink { fill: var(--ink); }
  .b-soft { fill: var(--primary-soft); }
  .glyph { fill: var(--paper); font-family: var(--font-display); font-weight: 600; font-size: 150px; }
  .cv-text { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }
  .cv-name { margin: 0; color: var(--ink); font-family: var(--font-display); font-weight: 600; font-size: 96px; line-height: .95; letter-spacing: -1px; }
  .cv-tag { margin: 12px 0 0; color: var(--muted); font-family: var(--font-body); font-size: 14px; }
</style>
<div class="cv">
  <svg viewBox="0 0 960 300" width="960" height="300" aria-hidden="true">
    <!-- blocks: primary 480×148 (bleeds top/right), clay 184×168, sun 136×112, ink 112×168, primary-soft 136×40; spacing gaps space-6 (24px)
         arrangement: the logo's three-block composition (wide top, two lower) scaled up, plus ink and a tint, bleeding off the top/right/bottom edges
         pattern: oversized display numeral row — Fraunces "¿" cut out of the teal block in paper, because the brand teaches Spanish and leads with Fraunces prompts
         radii: editorial corners radius-editorial-a 18 / radius-editorial-b 26 / radius-card 14 (clockwise from top-left) on every block -->
    <defs><clipPath id="tealClip"><path d="M522 -20H958A26 26 0 0 1 984 6V114A14 14 0 0 1 970 128H530A26 26 0 0 1 504 102V-2A18 18 0 0 1 522 -20Z"/></clipPath></defs>
    <path class="b-primary" d="M522 -20H958A26 26 0 0 1 984 6V114A14 14 0 0 1 970 128H530A26 26 0 0 1 504 102V-2A18 18 0 0 1 522 -20Z"/>
    <text class="glyph" x="600" y="96" clip-path="url(#tealClip)">¿</text>
    <path class="b-clay" d="M522 152H662A26 26 0 0 1 688 178V306A14 14 0 0 1 674 320H530A26 26 0 0 1 504 294V170A18 18 0 0 1 522 152Z"/>
    <path class="b-sun" d="M730 152H822A26 26 0 0 1 848 178V250A14 14 0 0 1 834 264H738A26 26 0 0 1 712 238V170A18 18 0 0 1 730 152Z"/>
    <path class="b-ink" d="M890 152H958A26 26 0 0 1 984 178V306A14 14 0 0 1 970 320H898A26 26 0 0 1 872 294V170A18 18 0 0 1 890 152Z"/>
    <path class="b-soft" d="M730 280H822A26 26 0 0 1 848 306V320H712V298A18 18 0 0 1 730 280Z"/>
  </svg>
  <div class="cv-text">
    <p class="cv-name">Spanish<br>Quizzes</p>
    <p class="cv-tag">A warm Spanish study notebook.</p>
  </div>
</div>
